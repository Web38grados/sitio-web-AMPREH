name: Deploy to Cloud Run

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'carresa' }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Google authentication configuration
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" && -n "$GCP_SERVICE_ACCOUNT" ]]; then
            echo "Using Workload Identity Federation"
          elif [[ -n "$GCP_SA_KEY" ]]; then
            echo "Using service account JSON secret"
          else
            echo "::error::Configure either GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT or GCP_SA_KEY in GitHub Actions secrets/variables."
            exit 1
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud via service account JSON
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate deployment variables
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'carresa' }}
          REGION: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}
        run: |
          if [[ -z "$PROJECT_ID" ]]; then
            echo "::error::GCP_PROJECT_ID is missing. Add it as a GitHub Actions variable."
            exit 1
          fi

          echo "Using project: $PROJECT_ID"
          echo "Using service: $SERVICE_NAME"
          echo "Using region: $REGION"

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'carresa' }}
        run: |
          IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${{ github.sha }}"
          echo "Building $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'carresa' }}
          REGION: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}
        run: |
          IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${{ github.sha }}"
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated
